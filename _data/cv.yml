# ---------------------------------------------------------------------------
# Curriculum vitae content, kept separate from the layout so the one-page
# homepage and the standalone /about/ page never drift apart.
#
# Consumed by:
#   _pages/about.html        (the one-page homepage, panel #education)
#   _pages/about-page.html   (the standalone /about/ page)
#
# `timeline` is a single chronologically ordered list. Entries tagged
# `track: main` form the solid spine — the degrees, in the order they were
# taken. Entries tagged `track: side` hang off that spine on a dashed branch
# and are rendered in a separate column so the two never overlap.
#
# `logo` is the mark shown next to the school name. `logo_dark` is the
# dark-theme variant; when it is omitted the light mark is reused.
# ---------------------------------------------------------------------------

timeline:
