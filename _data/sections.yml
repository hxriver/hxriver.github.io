# ---------------------------------------------------------------------------
# The panels of the deck homepage, in display order.
#
# Consumed by:
#   _pages/about.html     (renders one <section class="hz-panel"> per entry)
#   _layouts/modern.html  (renders the footer section navigation)
#
# The homepage is four panels: About, Research (research directions plus
# the news feed), Education & Work (the timeline plus awards and service)
# and Publications.
#
# `collection` marks a panel that only appears once the matching Jekyll
# collection has at least one entry — so empty sections never leave a blank
# panel or a dead footer link behind. The three collections below are still
# empty, so they add nothing to the page today.
# ---------------------------------------------------------------------------

- id: about
  label: "About"

- id: research
  label: "Research"

- id: education
  label: "Education & Work"

- id: publications
  label: "Publications"

- id: projects
  label: "Projects"
  collection: "projects"

- id: talks
  label: "Talks"
  collection: "talks"

- id: teaching
  label: "Teaching"
  collection: "teaching"
